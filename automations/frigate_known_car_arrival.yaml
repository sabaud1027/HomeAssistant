# Alerts only when a known car ARRIVES, not when it leaves.
#
# Arrival = the plate is read, THEN a car newly appears in drive_parked
#           within a minute.
# Departure = the car is already in drive_parked, THEN the plate is read as
#             it drives off, so no new drive_parked entry follows.
#
# This does not rely on Frigate keeping one continuous track of the car:
# as the car gets close and its box is cut off by the bottom of the frame,
# Frigate often drops the track and starts a new one with no plate attached.
# Any car newly entering drive_parked counts, whichever track it is on.
alias: Frigate - Known Car Arrived - Day Time
description: >-
  Notify when a known plate is read and a car then enters drive_parked
  within a minute. Plate reads on departure are ignored because the car is
  already parked when its plate is read.
triggers:
  - trigger: state
    entity_id: sensor.garage_door_camera_last_recognized_plate
    to: Matt's Car
    id: matts_car
  - trigger: state
    entity_id: sensor.garage_door_camera_last_recognized_plate
    to: Emma's Car
    id: emmas_car
conditions:
  - condition: time
    after: "07:00:00"
    before: "19:30:00"
actions:
  # A Frigate "new" event can arrive already in drive_parked, so accept that
  # as well as an update where drive_parked first appears. entered_zones only
  # ever grows, so a parked car flickering in and out of the zone does not
  # count.
  - wait_for_trigger:
      - trigger: mqtt
        topic: frigate/events
        payload: arrived
        value_template: >-
          {% set a = value_json.after %}
          {% set b = value_json.before %}
          {{ 'arrived' if a.camera == 'garage_door_camera'
               and a.label == 'car'
               and 'drive_parked' in (a.entered_zones or [])
               and (value_json.type == 'new'
                    or 'drive_parked' not in (b.entered_zones or []))
             else 'no' }}
    timeout: "00:01:00"
    continue_on_timeout: false
  - choose:
      - conditions:
          - condition: trigger
            id: emmas_car
        sequence:
          - action: telegram_bot.send_message
            metadata: {}
            data:
              entity_id:
                - notify.matt
              title: Frigate Notification
              message: Emma is home!
      - conditions:
          - condition: trigger
            id: matts_car
        sequence:
          - action: telegram_bot.send_message
            metadata: {}
            data:
              entity_id:
                - notify.matt
              title: Frigate Notification
              message: Matt is home!
mode: single
max_exceeded: silent
